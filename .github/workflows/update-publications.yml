name: Update publications

# Weekly refresh of src/data/publications.yml from INSPIRE. Because main is
# protected, the result is opened as a pull request (branch auto/publications)
# for the web team to approve. The workflow builds the site itself and reports
# a "build" status on the commit, which satisfies the required check.

on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run fetch-pubs
      - name: Stop if nothing changed
        id: diff
        run: |
          if git diff --quiet -- src/data/publications.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build with the new data
        if: steps.diff.outputs.changed == 'true'
        run: npx astro build
      - name: Commit to the auto/publications branch
        if: steps.diff.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B auto/publications
          git add src/data/publications.yml
          git commit -m "Refresh publications from INSPIRE"
          git push --force origin auto/publications
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report the build status on the commit
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.commit.outputs.sha }}" \
            -f state=success -f context=build -f description="Built by the publications workflow"
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr list --head auto/publications --state open --json number --jq '.[0].number' | grep -q .; then
            echo "Pull request already open; branch updated."
          else
            gh pr create --base main --head auto/publications \
              --title "Refresh publications from INSPIRE" \
              --body "Weekly automatic refresh of src/data/publications.yml. The site was built with the new data in the workflow run."
          fi
