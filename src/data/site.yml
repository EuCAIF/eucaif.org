# Site-wide facts. Edit these here; the pages read them.
name: EuCAIF
full_name: European Coalition for AI in Fundamental Physics
email: info@eucaif.org
mailing_list: eucaif-info@cern.ch
repo: https://github.com/EuCAIF/eucaif.org

hero:
  # `photo`: full-bleed background image with white text.
  # `animation`: light background with the seven-domain cluster animation.
  style: photo
  image: /images/hero-cosmiccliffs.jpg       # Webb "Cosmic Cliffs", Carina Nebula (NIRCam)
  image_credit: NASA, ESA, CSA, and STScI
  # alternatives (all public domain):
  #   /images/hero-deepfield.jpg   Webb's First Deep Field (SMACS 0723), NASA, ESA, CSA, STScI
  #   /images/hero-nebula.jpg      Carina Nebula (Hubble), NASA, ESA, N. Smith and the Hubble Heritage Team

conference:
  # Shown in the hero and at the end of the conference section. Set `upcoming`
  # to null when nothing is announced yet. `url` may be null until a site exists.
  upcoming:
    name: EuCAIFCon 2027
    venue: Paris
    dates: Summer 2027
    url: null
  latest:
    name: EuCAIFCon 2026
    venue: Heidelberg
    dates: August 24 - 28, 2026
    url: https://indico.physi.uni-heidelberg.de/event/1277/

# Extra notes shown in the hero under the conference note, in the same three-line
# format. Remove an entry to hide it.
hero_notes:
  - label: COST Action
    title: AIFORIA
    meta: CA25172 · 2026 – 2030
    url: https://aiforia.eucaif.org/

# The AIFORIA section on the home page (text in src/content/sections/aiforia.md).
aiforia:
  url: https://aiforia.eucaif.org/
  join_url: https://aiforia.eucaif.org/#join

# Thin strip under the navigation on every page except the home page.
# Set to null to switch it off (for example after the launch period).
announcement:
  text: The COST Action AIFORIA has started.
  link_label: Join a working group
  url: https://aiforia.eucaif.org/#join
