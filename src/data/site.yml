# Site-wide facts. Edit these here; the pages read them.
name: EuCAIF
full_name: European Coalition for AI in Fundamental Physics
email: info@eucaif.org
mailing_list: eucaif-info@cern.ch

hero:
  # `photo`: full-bleed background image with white text.
  # `animation`: light background with the seven-domain cluster animation.
  style: photo
  image: /images/hero-deepfield.jpg          # Webb's First Deep Field (SMACS 0723)
  image_credit: NASA, ESA, CSA, and STScI
  # alternative: /images/hero-nebula.jpg (Carina Nebula, NASA, ESA, N. Smith and the Hubble Heritage Team)

conference:
  # Shown in the hero and at the end of the conference section. Set `upcoming`
  # to null when nothing is announced yet. `url` may be null until a site exists.
  upcoming:
    name: EuCAIFCon 2027
    venue: Paris
    dates: Summer 2027
    url: null
  latest:
    name: EuCAIFCon 2026
    venue: Heidelberg
    dates: August 24 - 28, 2026
    url: https://indico.physi.uni-heidelberg.de/event/1277/
