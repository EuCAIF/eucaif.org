# EuCAIF working groups. Shown on /activities/.
- number: 1
  title: Foundation models & discovery
  summary: Exploring how multimodal foundation models can move fundamental science from narrow, task-centric applications to general-purpose discovery.
  description: >-
    The current pinnacle of AI are so-called foundation models (FMs) as pioneered in LLMs like ChatGPT or image
    generators like DALL-E. Multimodal FMs centralize information from various data modalities and domains and
    encode them in a common meaningful latent representation. They offer an opportunity to go from narrow
    task-centric applications to general-purpose tasks. This working group serves as a platform to discuss the
    potential transformative impact of FMs for fundamental science and discovery in particular, and how we can
    as a community foster progress.

- number: 2
  title: AI-assisted co-design of future ground- and space-based detectors
  summary: Replacing obsolete detector design paradigms with simulation-driven, end-to-end optimisation of instruments.
  goals:
    - Identify existing design paradigms for particle and astroparticle physics instruments which have become obsolete in the AI era, and assemble software strategies and research paths to overtake them.
    - Support the development of simulation tools that constitute enablers of co-design approaches to holistic optimization for detector use cases in HEP, astro-HEP, nuclear and neutrino physics.
    - Understand physical limits of information generated by particle interactions in granular calorimeters and conditions for its lossless extraction, as a preliminary step toward the AI-assisted hybridization of calorimeters and tracking detectors into optimized variable-density systems.

- number: 3
  title: FAIR-ness & sustainability
  summary: Making machine-learning models and datasets in fundamental physics findable, accessible, interoperable and reproducible, and accounting for their environmental cost.
  goals:
    - Review existing activities in fundamental physics that strive to make ML algorithms Findable, Accessible, Interoperable and Reproducible, including ML datasets.
    - Understand the barriers to making ML FAIR, including the availability of standardised tools and computing facilities for retraining or using someone else's model.
    - Discuss steps to facilitate and promote FAIR ML in fundamental science.
    - Start efforts to review and frame the environmental sustainability of ML algorithms, including the trade-off with performance.

- number: 4
  title: Machine learning and AI infrastructure
  subtitle: JENA Computing Initiative, Work Package 4
  summary: Strategising European federated computing for ML workloads at future large-scale research facilities.
  description: >-
    The mission of the Joint ECFA-NuPECC-APPEC (JENA) Computing Initiative's Machine Learning and Artificial
    Intelligence working group is to strategize and implement European federated computing solutions for future
    large-scale research facilities. Through a comprehensive survey, the group assesses and quantifies the resource
    needs of physicists to run ML workloads effectively.
  image: /eucaif.org/images/jenaa.png

- number: 5
  title: Building bridges
  subtitle: Community, connections and funding
  summary: Making the exchange between fundamental physics and the wider machine-learning community a two-way street.
  description: >-
    ML in particle physics is a very small field, and the way we usually operate is that we identify field-specific
    opportunities and challenges and then develop new solutions together with ML experts from other fields, or
    based on their work. The obvious questions are how we can make this communication more efficient, and how we
    can organise a proper feedback loop so that our solutions are used by the ML community.
